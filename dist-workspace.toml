# Binary release configuration for dist (https://axodotdev.github.io/cargo-dist).
#
# dist only builds here: no dist-generated workflow exists. The release chain
# in .github/workflows/auto-release.yml calls build-verify.yml, which builds and
# verifies these artifacts at the final version before anything is tagged or
# published, then uploads exactly those verified files to a draft GitHub
# Release. docs/publishing.md describes the order.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.1"
# Without `ci = "github"` dist no longer infers where the release is hosted,
# and the shell installer needs the download base URL
# (https://github.com/<owner>/<repo>/releases/download/<tag>).
hosting = "github"
installers = ["shell"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
# Per-artifact .sha256 files plus a combined sha256.sum.
checksum = "sha256"
# `$XDG_BIN_HOME` when set, else ~/.local/bin: where the Python package's
# console scripts used to land for uv/pipx users.
install-path = ["$XDG_BIN_HOME/", "~/.local/bin"]
install-updater = false
