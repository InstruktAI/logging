[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.1"
installers = ["shell"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
checksum = "sha256"
install-path = ["$XDG_BIN_HOME/", "~/.local/bin"]
install-updater = false
hosting = "github"
