# Binary release configuration for dist (https://axodotdev.github.io/cargo-dist).
# `dist generate` owns .github/workflows/release.yml from this file; never edit
# that workflow by hand (`dist plan` in CI fails when it drifts from here).
#
# The release is driven by .github/workflows/auto-release.yml: it tags, creates
# the GitHub Release with the inspector-written notes, then dispatches
# release.yml with `tag=vX.Y.Z`. dist only uploads the binaries, checksums and
# installer to that existing release (create-release = false) and leaves its
# notes untouched.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.1"
ci = "github"
installers = ["shell"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
# Per-artifact .sha256 files plus a combined sha256.sum.
checksum = "sha256"
# `$XDG_BIN_HOME` when set, else ~/.local/bin: where the Python package's
# console scripts used to land for uv/pipx users.
install-path = ["$XDG_BIN_HOME/", "~/.local/bin"]
install-updater = false
dispatch-releases = true
create-release = false
# PR checks live in ci.yml (read-only token); the generated workflow, which
# needs contents: write, never runs on pull requests.
pr-run-mode = "skip"

[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
