name: Release (Auto)

# Every push to main: the release inspector decides the bump and writes the
# notes, the CI checks run, then the `version` job makes one
# `chore(release): vX` commit that bumps every version location, tags it and
# pushes both atomically. The `publish` job then creates the GitHub Release
# with the inspector's notes (unless it already exists) and dispatches the
# publish workflows for the tag:
#   - release.yml (dist-generated): binaries, checksums and the shell
#     installer, uploaded to the existing GitHub Release.
#   - publish.yml: crates.io and PyPI.
#
# Resuming: once the tag is pushed, nothing bumps again. `publish` does only
# what is missing: it creates the GitHub Release if absent, dispatches
# release.yml when none of the assets dist plans for the tag are on the
# release (and stops with recovery steps when only some are), and always
# dispatches publish.yml (which skips versions already on the registries).
# The failed `publish` job can be re-run, and a new dispatch while HEAD is the
# tagged release commit goes straight to `publish` without inspecting or
# bumping. docs/publishing.md has the recipes.
on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: release-main
  cancel-in-progress: false

permissions: {}

jobs:
  # The inspector action does not support the push event, so a push only
  # starts this same workflow through workflow_dispatch, which it supports.
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the release run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run auto-release.yml --ref main

  # Decides what this run does:
  #   release - HEAD carries no release tag: inspect, check, bump, publish.
  #   resume  - HEAD is a release commit carrying its tag: publish only (it
  #             finishes whatever is missing), no inspection, no bump.
  gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
      last_tag: ${{ steps.gate.outputs.last_tag }}
      head_tag: ${{ steps.gate.outputs.head_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Release or resume?
        id: gate
        run: |
          set -euo pipefail
          LAST_TAG="$(git tag --list 'v*' --sort=-version:refname | head -n1 || true)"
          HEAD_TAG="$(git tag --points-at HEAD --list 'v*' --sort=-version:refname | head -n1 || true)"
          echo "last_tag=${LAST_TAG}" >> "$GITHUB_OUTPUT"
          echo "head_tag=${HEAD_TAG}" >> "$GITHUB_OUTPUT"
          if [ -n "${HEAD_TAG}" ]; then
            echo "::notice::HEAD is the release commit of ${HEAD_TAG}; resuming its publication (no inspection, no bump)."
            echo "mode=resume" >> "$GITHUB_OUTPUT"
          else
            echo "HEAD carries no release tag; releasing the commits since ${LAST_TAG:-the beginning}."
            echo "mode=release" >> "$GITHUB_OUTPUT"
          fi

  # The inspector reads commit-derived text, so it runs in its own job with a
  # read-only token that is never persisted into the workspace. It hands the
  # version job only a validated bump and a notes file.
  inspect:
    needs: gate
    if: needs.gate.outputs.mode == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bump: ${{ steps.decision.outputs.bump }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Collect commits since last tag
        env:
          LAST_TAG: ${{ needs.gate.outputs.last_tag }}
        run: |
          set -euo pipefail
          if [ -n "${LAST_TAG}" ]; then
            git log "${LAST_TAG}..HEAD" --pretty=format:'- %s%n%b%n' > commits.txt
          else
            git log HEAD --pretty=format:'- %s%n%b%n' > commits.txt
          fi

      - name: Release inspector decides bump + release notes
        id: inspect
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # The dispatched run is started by the workflow's own bot identity.
          allowed_bots: github-actions
          prompt: |
            Follow .github/prompts/release-inspector.md exactly.
            Last release tag: ${{ needs.gate.outputs.last_tag }}
            Commit log since that tag is in commits.txt.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
            --json-schema '{"type":"object","properties":{"bump":{"type":"string","enum":["minor","patch"]},"breaking":{"type":"boolean"},"rationale":{"type":"string"},"notes_markdown":{"type":"string"}},"required":["bump","breaking","rationale","notes_markdown"],"additionalProperties":false}'

      - name: Validate inspector result
        id: decision
        env:
          INSPECTOR_RESULT: ${{ steps.inspect.outputs.structured_output }}
        run: |
          set -euo pipefail
          # Env var instead of templating into the shell: safe against
          # embedded newlines, quotes, or backticks in the result.
          printf '%s' "$INSPECTOR_RESULT" > inspector.json
          # The action does not validate the result against the schema, so the
          # full contract is checked here; any violation stops the release.
          jq -e '
            (.bump | IN("minor", "patch"))
            and (.breaking | type == "boolean")
            and (.rationale | type == "string" and length > 0)
            and (.notes_markdown | type == "string" and length > 0)
          ' inspector.json >/dev/null
          jq -r '.rationale' inspector.json
          jq -r '.notes_markdown' inspector.json > release-notes.md
          echo "bump=$(jq -r '.bump' inspector.json)" >> "$GITHUB_OUTPUT"

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # The same checks a pull request runs (lint, types, tests, conformance,
  # binary builds for every target, installer smoke test).
  checks:
    needs: gate
    if: needs.gate.outputs.mode == 'release'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # Bumps, commits, tags and pushes atomically. Once this succeeded the
  # version exists; nothing after it bumps again.
  version:
    needs: [gate, inspect, checks]
    if: needs.gate.outputs.mode == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-12
        with:
          toolchain: "1.99.1"

      - name: Install dist
        uses: ./.github/actions/install-dist

      - name: Bump every version location
        id: bump
        env:
          BUMP: ${{ needs.inspect.outputs.bump }}
        run: |
          set -euo pipefail
          python3 .github/scripts/version.py check
          # Fetch while Cargo.lock still matches Cargo.toml, so the workspace
          # re-lock below can run offline and only touches our own crates.
          cargo fetch --locked
          # pyproject.toml + uv.lock (re-locked, not --frozen, so uv.lock
          # carries the new version too).
          uv version --bump "${BUMP}" --no-sync
          VERSION="$(uv version --short)"
          # Root Cargo.toml: [workspace.package] version + the
          # instrukt-ai-logging pin in [workspace.dependencies].
          python3 .github/scripts/version.py set-cargo "${VERSION}"
          cargo update --workspace --offline
          # Everything agrees, both lockfiles are consistent, and dist accepts
          # the tag it will be dispatched with.
          python3 .github/scripts/version.py check
          cargo metadata --locked --offline --format-version 1 > /dev/null
          uv lock --check
          dist plan --tag="v${VERSION}" > /dev/null
          CHANGED="$(git diff --name-only | sort | tr '\n' ' ')"
          if [ "${CHANGED}" != "Cargo.lock Cargo.toml pyproject.toml uv.lock " ]; then
            echo "::error::unexpected files changed by the bump: ${CHANGED}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit + tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock Cargo.toml Cargo.lock
          git commit -m "chore(release): v${VERSION}"
          git tag "v${VERSION}"
          # Atomic: either main and the tag both move, or neither does.
          git push --atomic origin HEAD:main "refs/tags/v${VERSION}"

  # Finishes the publication of the tag, doing only what is missing: creates
  # the GitHub Release if absent, dispatches release.yml when none of dist's
  # planned assets are on it (stops on a partial upload), always dispatches
  # publish.yml. It never bumps.
  publish:
    needs: [gate, version]
    if: >-
      always() && (needs.gate.outputs.mode == 'resume'
      || (needs.gate.outputs.mode == 'release' && needs.version.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.gate.outputs.mode == 'resume' && needs.gate.outputs.head_tag || format('v{0}', needs.version.outputs.version) }}
      INSTALLER_ASSET: instrukt-ai-logs-installer.sh
    steps:
      # dist plans the asset set from the tagged sources.
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Install dist
        uses: ./.github/actions/install-dist

      - name: Does the GitHub Release exist?
        id: existing
        run: |
          set -euo pipefail
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "::notice::GitHub Release ${TAG} already exists; keeping it and its notes."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release notes
        if: steps.existing.outputs.exists == 'false' && needs.gate.outputs.mode == 'release'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      - name: Create GitHub Release
        if: steps.existing.outputs.exists == 'false'
        run: |
          set -euo pipefail
          if [ ! -f release-notes.md ]; then
            echo "::error::${TAG} is tagged but has no GitHub Release, and this run has no inspector notes for it. Re-run the failed 'publish' job of the run that pushed ${TAG} (its notes artifact is kept), or create the release by hand with 'gh release create ${TAG} --verify-tag --notes-file <notes.md>' and dispatch this workflow again. See docs/publishing.md."
            exit 1
          fi
          gh release create "${TAG}" --verify-tag --title "${TAG}" --notes-file release-notes.md

      # The default GITHUB_TOKEN can't trigger workflows through a push (loop
      # guard), so the tag's publish workflows are dispatched.
      - name: Dispatch the binary release (dist) unless its assets are uploaded
        run: |
          set -euo pipefail
          # Every file release.yml uploads: each planned artifact that has a
          # file (`name`), plus the dist-manifest.json its host job adds.
          dist plan --tag="${TAG}" --output-format=json > "${RUNNER_TEMP}/plan.json"
          .github/scripts/dist-assets.sh "${RUNNER_TEMP}/plan.json" > "${RUNNER_TEMP}/expected.txt"
          if ! grep -qxF "${INSTALLER_ASSET}" "${RUNNER_TEMP}/expected.txt"; then
            echo "::error::dist plan for ${TAG} does not list ${INSTALLER_ASSET}; cannot tell which assets release.yml uploads."
            exit 1
          fi
          gh release view "${TAG}" --json assets --jq '.assets[].name' | sort -u > "${RUNNER_TEMP}/present.txt"
          sort -u "${RUNNER_TEMP}/expected.txt" -o "${RUNNER_TEMP}/expected.txt"
          comm -12 "${RUNNER_TEMP}/expected.txt" "${RUNNER_TEMP}/present.txt" > "${RUNNER_TEMP}/uploaded.txt"
          comm -23 "${RUNNER_TEMP}/expected.txt" "${RUNNER_TEMP}/present.txt" > "${RUNNER_TEMP}/missing.txt"
          if [ ! -s "${RUNNER_TEMP}/uploaded.txt" ]; then
            gh workflow run release.yml --ref "${TAG}" -f tag="${TAG}"
          elif [ ! -s "${RUNNER_TEMP}/missing.txt" ]; then
            echo "::notice::${TAG} already carries every dist asset; not dispatching release.yml."
          else
            {
              echo "::error::${TAG} carries only part of the dist assets, and release.yml cannot upload over them."
              echo "Present:"; sed 's/^/  /' "${RUNNER_TEMP}/uploaded.txt"
              echo "Missing:"; sed 's/^/  /' "${RUNNER_TEMP}/missing.txt"
              echo "Recover: delete each present asset, then dispatch this workflow again:"
              sed "s/^/  gh release delete-asset ${TAG} /; s/\$/ -y/" "${RUNNER_TEMP}/uploaded.txt"
              echo "  gh workflow run auto-release.yml --ref main"
            } >&2
            exit 1
          fi

      - name: Dispatch crates.io and PyPI publication
        # publish.yml skips a version already on a registry.
        run: gh workflow run publish.yml --ref "${TAG}"
