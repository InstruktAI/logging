name: Release (Auto)

# Every push to main. The shipped bytes are the verified bytes, and nothing is
# visible until they are verified:
#   gate -> inspect -> checks -> version -> preflight -> build-verify
#        -> land -> github-release -> crates -> pypi
#   - inspect: the release inspector decides minor, patch or none, and writes
#     the notes. `none` ends the run.
#   - version bumps every version location and commits locally only; the
#     commit travels to later jobs as a patch with its SHA.
#   - preflight proves vX is free everywhere (tag, GitHub Release incl.
#     drafts, crates.io and PyPI incl. yanked) and the secrets are set.
#   - build-verify builds and checks every artifact at vX.
#   - land pushes the commit and the tag atomically, fast-forward only.
#   - github-release uploads the verified files to a draft, checks them back
#     by name and digest, then publishes it.
#   - crates, then pypi (publish.yml), skipping what is already published.
# Up to build-verify nothing exists outside the run. After land the tag is
# correct; recovery is "Re-run failed jobs" on the same run. Resume mode (HEAD
# is a tagged release commit) only checks that the release is complete; it
# never rebuilds or uploads. With dry_run,
# everything up to build-verify runs and nothing lands. docs/publishing.md has
# the recipes.
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run everything up to and including build-verify; land and publish nothing.
        type: boolean
        default: false

concurrency:
  group: release-main
  cancel-in-progress: false

permissions: {}

jobs:
  # The inspector action does not support the push event, so a push only
  # starts this same workflow through workflow_dispatch, which it supports.
  # The dispatched run leaves dry_run at its default, false.
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the release run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run auto-release.yml --ref main

  # Decides what this run does:
  #   release - HEAD carries no release tag: inspect, check, bump, verify,
  #             land, publish.
  #   resume  - HEAD is a release commit carrying its tag: check that its
  #             GitHub Release and registries are complete. No inspection,
  #             no bump, no rebuild, no upload.
  gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
      last_tag: ${{ steps.gate.outputs.last_tag }}
      head_tag: ${{ steps.gate.outputs.head_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Release or resume?
        id: gate
        run: |
          set -euo pipefail
          LAST_TAG="$(git tag --list 'v*' --sort=-version:refname | head -n1 || true)"
          HEAD_TAG="$(git tag --points-at HEAD --list 'v*' --sort=-version:refname | head -n1 || true)"
          echo "last_tag=${LAST_TAG}" >> "$GITHUB_OUTPUT"
          echo "head_tag=${HEAD_TAG}" >> "$GITHUB_OUTPUT"
          if [ -n "${HEAD_TAG}" ]; then
            echo "::notice::HEAD is the release commit of ${HEAD_TAG}; checking that its publication is complete (no inspection, no bump, no rebuild, no upload)."
            echo "mode=resume" >> "$GITHUB_OUTPUT"
          else
            echo "HEAD carries no release tag; releasing the commits since ${LAST_TAG:-the beginning}."
            echo "mode=release" >> "$GITHUB_OUTPUT"
          fi

  # The inspector reads commit-derived text, so it runs in its own job with a
  # read-only token that is never persisted into the workspace. It hands on
  # only a validated bump; its notes and rationale travel as an artifact,
  # never as a job output (the runner withholds an output holding text it
  # masks as a credential).
  inspect:
    needs: gate
    if: needs.gate.outputs.mode == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bump: ${{ steps.decision.outputs.bump }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Collect commits since last tag
        env:
          LAST_TAG: ${{ needs.gate.outputs.last_tag }}
        run: |
          set -euo pipefail
          if [ -n "${LAST_TAG}" ]; then
            git log "${LAST_TAG}..HEAD" --pretty=format:'- %s%n%b%n' > commits.txt
          else
            git log HEAD --pretty=format:'- %s%n%b%n' > commits.txt
          fi

      - name: Release inspector decides bump + release notes
        id: inspect
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # The dispatched run is started by the workflow's own bot identity.
          allowed_bots: github-actions
          prompt: |
            Follow .github/prompts/release-inspector.md exactly.
            Last release tag: ${{ needs.gate.outputs.last_tag }}
            Commit log since that tag is in commits.txt.
          # The action returns the result as the `structured_output` output
          # when claude_args carries --json-schema (action.yml at this pin).
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
            --json-schema '{"type":"object","properties":{"bump":{"type":"string","enum":["minor","patch","none"]},"breaking":{"type":"boolean"},"rationale":{"type":"string"},"notes_markdown":{"type":"string"}},"required":["bump","breaking","rationale","notes_markdown"],"additionalProperties":false}'

      - name: Validate inspector result
        id: decision
        env:
          INSPECTOR_RESULT: ${{ steps.inspect.outputs.structured_output }}
          LAST_TAG: ${{ needs.gate.outputs.last_tag }}
        run: |
          set -euo pipefail
          mkdir -p inspector
          # Env var instead of templating into the shell: safe against
          # embedded newlines, quotes, or backticks in the result.
          printf '%s' "$INSPECTOR_RESULT" > inspector/inspector.json
          # The action does not validate the result against the schema, so the
          # full contract is checked here; any violation stops the release.
          jq -e '
            (.bump | IN("minor", "patch", "none"))
            and (.breaking | type == "boolean")
            and ((.breaking | not) or .bump == "minor")
            and (.rationale | type == "string" and length > 0)
            and (.notes_markdown | type == "string")
            and (.bump == "none" or (.notes_markdown | length > 0))
          ' inspector/inspector.json >/dev/null
          jq -r '.rationale' inspector/inspector.json
          jq -r '.notes_markdown' inspector/inspector.json > inspector/release-notes.md
          BUMP="$(jq -r '.bump' inspector/inspector.json)"
          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"
          if [ "${BUMP}" = "none" ]; then
            {
              echo "### No release"
              echo
              echo "The release inspector found nothing that ships to consumers since ${LAST_TAG:-the beginning}."
              echo
              jq -r '.rationale' inspector/inspector.json
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload the inspector result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: inspector/
          if-no-files-found: error

  # The same checks a pull request runs. Its own artifact build is off: the
  # release builds and verifies the release commit below.
  checks:
    needs: [gate, inspect]
    if: needs.gate.outputs.mode == 'release' && needs.inspect.outputs.bump != 'none'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      skip-build-verify: true

  # Bumps every version location and commits locally only; the commit leaves
  # the job as a patch artifact plus its base and SHA. Nothing is pushed.
  version:
    needs: [gate, inspect, checks]
    if: needs.gate.outputs.mode == 'release' && needs.inspect.outputs.bump != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.bump.outputs.version }}
      base_sha: ${{ steps.commit.outputs.base_sha }}
      release_sha: ${{ steps.commit.outputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-12
        with:
          toolchain: "1.99.1"

      - name: Install dist
        uses: ./.github/actions/install-dist

      - name: Bump every version location
        id: bump
        env:
          BUMP: ${{ needs.inspect.outputs.bump }}
        run: .github/scripts/bump.sh "${BUMP}" >> "$GITHUB_OUTPUT"

      - name: Commit locally
        id: commit
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: .github/scripts/release-commit.sh make "${VERSION}" "${RUNNER_TEMP}/release-commit" >> "$GITHUB_OUTPUT"

      - name: Upload the release commit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-commit
          path: ${{ runner.temp }}/release-commit/
          if-no-files-found: error

  # Any failure stops the release before anything is visible. contents: write
  # only because GitHub lists draft releases to push access alone
  # (https://docs.github.com/en/rest/releases/releases); nothing here writes.
  preflight:
    needs: [gate, version]
    if: needs.gate.outputs.mode == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: vX is free everywhere and the publishing secrets are set
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: .github/scripts/preflight.sh "${VERSION}"

  build-verify:
    needs: [gate, version, preflight]
    if: needs.gate.outputs.mode == 'release'
    permissions:
      contents: read
    uses: ./.github/workflows/build-verify.yml
    with:
      version: ${{ needs.version.outputs.version }}
      release-commit-artifact: release-commit
      base-sha: ${{ needs.version.outputs.base_sha }}
      release-sha: ${{ needs.version.outputs.release_sha }}

  dry-run:
    name: Dry run summary
    needs: [gate, version, build-verify]
    if: needs.gate.outputs.mode == 'release' && inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch the inspector result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: inspector

      - name: Fetch the verified release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Summary
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "### Dry run: v${VERSION} was not landed or published"
            echo
            echo "- bump: $(jq -r '.bump' inspector/inspector.json) (breaking: $(jq -r '.breaking' inspector/inspector.json))"
            echo "- version: ${VERSION}"
            echo
            echo "**Rationale**"
            echo
            jq -r '.rationale' inspector/inspector.json
            echo
            echo "**Verified release assets**"
            echo
            echo "| asset | bytes | sha256 |"
            echo "| --- | ---: | --- |"
            for f in release-assets/*; do
              echo "| \`$(basename "${f}")\` | $(wc -c < "${f}" | tr -d ' ') | \`$(sha256sum "${f}" | cut -d' ' -f1)\` |"
            done
          } >> "${GITHUB_STEP_SUMMARY}"

  # The point of no return: main and the tag move together, fast-forward only.
  land:
    needs: [gate, version, build-verify]
    if: needs.gate.outputs.mode == 'release' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the release base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.base_sha }}

      - name: Apply the release commit
        uses: ./.github/actions/apply-release-commit
        with:
          artifact: release-commit
          base-sha: ${{ needs.version.outputs.base_sha }}
          release-sha: ${{ needs.version.outputs.release_sha }}

      - name: Push main and the tag atomically
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BASE_SHA: ${{ needs.version.outputs.base_sha }}
          RELEASE_SHA: ${{ needs.version.outputs.release_sha }}
        run: .github/scripts/land.sh "${VERSION}" "${BASE_SHA}" "${RELEASE_SHA}"

  # Draft, upload the verified files, read them back, publish. A failure
  # deletes the draft; the tag stays and "Re-run failed jobs" redoes this job
  # from the same artifacts.
  github-release:
    needs: [gate, version, land]
    if: needs.gate.outputs.mode == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.base_sha }}
          persist-credentials: false

      - name: Fetch the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/inspector

      - name: Fetch the verified release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets

      - name: Draft, verify, publish
        env:
          TAG: v${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/github-release.sh publish "${TAG}" "${RUNNER_TEMP}/release-assets" "${RUNNER_TEMP}/inspector/release-notes.md"

  # Resume mode never rebuilds and never uploads: the verified files live only
  # in the run that pushed the tag. It passes when the tag's GitHub Release is
  # public with exactly the planned assets and both registries have the
  # version; anything missing fails with the way back to that run.
  resume:
    needs: gate
    if: needs.gate.outputs.mode == 'resume'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.gate.outputs.head_tag }}
          persist-credentials: false

      - name: Install dist
        uses: ./.github/actions/install-dist

      - name: The GitHub Release is public with the exact asset set
        env:
          TAG: ${{ needs.gate.outputs.head_tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dist plan --tag="${TAG}" --output-format=json > "${RUNNER_TEMP}/plan.json"
          .github/scripts/dist-assets.sh "${RUNNER_TEMP}/plan.json" > "${RUNNER_TEMP}/planned.txt"
          if ! .github/scripts/github-release.sh check-published "${TAG}" "${RUNNER_TEMP}/planned.txt"; then
            echo "::error::${TAG} has no complete public GitHub Release. Resume never rebuilds or uploads: open the run that pushed ${TAG} and use 'Re-run failed jobs' there (it holds the verified artifacts). See docs/publishing.md."
            exit 1
          fi

      - name: crates.io and PyPI have the version
        env:
          TAG: ${{ needs.gate.outputs.head_tag }}
        run: |
          set -euo pipefail
          if ! .github/scripts/registries-complete.sh "${TAG#v}"; then
            echo "::error::${TAG} is not on every registry. Resume never uploads unverified files: open the run that pushed ${TAG} and use 'Re-run failed jobs' there (it holds the verified python-dist artifact). See docs/publishing.md."
            exit 1
          fi
          echo "${TAG} is complete: GitHub Release, crates.io and PyPI."

  crates:
    needs: [gate, version, github-release]
    if: needs.gate.outputs.mode == 'release' && !inputs.dry_run
    permissions:
      contents: read
    uses: ./.github/workflows/publish.yml
    with:
      tag: v${{ needs.version.outputs.version }}
      registry: crates
    secrets: inherit

  pypi:
    needs: [gate, version, crates]
    if: needs.gate.outputs.mode == 'release' && !inputs.dry_run
    permissions:
      contents: read
    uses: ./.github/workflows/publish.yml
    with:
      tag: v${{ needs.version.outputs.version }}
      registry: pypi
      # The exact files build-verify checked, from this run.
      python-dist-artifact: python-dist
    secrets: inherit
