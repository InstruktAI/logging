name: CI

# Every pull request to main and every push to main runs these checks, and
# release-chain.yml calls this workflow as the checks of a release. It never
# publishes anything and references no publishing secret. The `artifacts`
# job (build-verify.yml) builds every release artifact and proves it installs
# and works.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_call:
    outputs:
      version:
        description: The repository version (X.Y.Z) the verified artifacts carry
        value: ${{ jobs.artifacts.outputs.version }}

permissions:
  contents: read

concurrency:
  # Superseded PR pushes cancel; a push to main or a release-time call never
  # shares a group.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Pinned so lint results do not move under a release; bump deliberately.
  RUST_TOOLCHAIN: "1.96.0"
  UV_VERSION: "0.9.26"

jobs:
  workflows:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run actionlint and shellcheck
        # Pinned binaries, verified against their release assets' sha256.
        # actionlint runs shellcheck over every workflow `run:` block; the
        # scripts under .github/scripts are checked directly.
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/lint"
          mkdir -p "${dir}"
          curl --proto '=https' --tlsv1.2 -fsSL -o "${dir}/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${dir}/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "${dir}/actionlint.tar.gz" -C "${dir}" actionlint
          curl --proto '=https' --tlsv1.2 -fsSL -o "${dir}/shellcheck.tar.gz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          echo "${SHELLCHECK_SHA256}  ${dir}/shellcheck.tar.gz" | sha256sum -c -
          tar -xzf "${dir}/shellcheck.tar.gz" -C "${dir}" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          "${dir}/shellcheck" --version
          "${dir}/actionlint" -color -shellcheck "${dir}/shellcheck"
          "${dir}/shellcheck" .github/scripts/*.sh

  versions:
    name: Versions agree (Python and Cargo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Check one repository version
        run: python .github/scripts/version.py check

      # The runner masks the word "Bearer" followed by a word as a credential
      # and withholds any job output or text that holds it; release notes come
      # from CHANGELOG.md, so it must not carry such text.
      - name: CHANGELOG.md holds no text the runner masks
        run: python .github/scripts/changelog.py masked-text

  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: true

      - name: Install dev deps
        # --locked fails when uv.lock is stale against pyproject.toml.
        run: uv sync --group dev --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Mypy
        run: uv run mypy

      - name: Pytest (includes the Python writer conformance)
        run: uv run pytest

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-12
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests (includes the Rust conformance runners)
        run: cargo test --workspace --locked

  # Every release artifact, built and verified: the four binary archives, the
  # installer, checksums, the exact asset set, an install test on each runner,
  # the crate packages and the Python wheel and sdist.
  artifacts:
    name: Release artifacts
    uses: ./.github/workflows/build-verify.yml
