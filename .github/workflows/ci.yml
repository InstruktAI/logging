name: CI

# The same checks gate a pull request, every push to main and a release:
# auto-release.yml calls this workflow before it bumps, tags and publishes
# anything. It never references a publishing secret.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_call:
    inputs:
      skip-build-verify:
        description: >-
          Skip building and verifying the release artifacts of the tree as it
          is. auto-release.yml passes true: it runs build-verify.yml itself on
          the release commit, and one run cannot upload the same artifact
          twice.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Superseded PR pushes cancel; a release-time call never shares a group.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Pinned so lint results do not move under a release; bump deliberately.
  RUST_TOOLCHAIN: "1.96.0"
  UV_VERSION: "0.9.26"

jobs:
  workflows:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/actionlint"
          mkdir -p "${dir}"
          curl --proto '=https' --tlsv1.2 -fsSL -o "${dir}/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${dir}/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "${dir}/actionlint.tar.gz" -C "${dir}" actionlint
          "${dir}/actionlint" -color

  versions:
    name: Versions agree (Python and Cargo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Check one repository version
        run: python .github/scripts/version.py check

      # dist embeds the released version's CHANGELOG.md section in its plan
      # and hands the plan to its build jobs as a job output. The runner
      # withholds a job output that holds text it masks as a credential (it
      # masks the word "Bearer" followed by a token), and the build jobs are
      # then skipped: v0.7.0 shipped without binaries that way.
      - name: CHANGELOG.md holds no text the runner masks
        run: |
          set -euo pipefail
          if grep -niE 'bearer[[:space:]]+[^[:space:]]' CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::The Actions runner masks 'Bearer <word>' as a credential, which drops dist's release plan and skips the binary builds. Reword these lines."
            exit 1
          fi

  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: true

      - name: Install dev deps
        # --locked fails when uv.lock is stale against pyproject.toml.
        run: uv sync --group dev --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Mypy
        run: uv run mypy

      - name: Pytest (includes the Python writer conformance)
        run: uv run pytest

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-12
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests (includes the Rust conformance runners)
        run: cargo test --workspace --locked

  # Every release artifact, built and proven the way a release builds it.
  build-verify:
    # On pull_request and push, inputs is empty and this reads null. Compare
    # with true: GitHub's loose equality treats null == false as true.
    if: inputs.skip-build-verify != true
    permissions:
      contents: read
    uses: ./.github/workflows/build-verify.yml
