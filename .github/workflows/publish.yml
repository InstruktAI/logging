name: Publish

# Dispatched by auto-release.yml for each new tag (`--ref vX.Y.Z`); can also be
# dispatched by hand on a tag. Each registry is its own job, so a failed one can
# be re-run alone ("Re-run failed jobs"), and each skips a version that is
# already published, so re-running is safe.
on:
  workflow_dispatch:
    inputs:
      registry:
        description: Which registry to publish to
        type: choice
        options: [all, crates, pypi]
        default: all

permissions: {}

jobs:
  tag:
    name: Check the dispatched ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Ref is a release tag matching every version location
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${REF_TYPE}" != "tag" ] || [[ ! "${REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::dispatch this workflow on a release tag (vX.Y.Z), not ${REF_TYPE} ${REF_NAME}"
            exit 1
          fi
          python .github/scripts/version.py check
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${VERSION}" != "${REF_NAME}" ]; then
            echo "::error::tag ${REF_NAME} does not match the repository version ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  crates:
    name: crates.io
    needs: tag
    if: inputs.registry == 'all' || inputs.registry == 'crates'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-12
        with:
          toolchain: "1.96.0"

      - name: Publish instrukt-ai-logging, then instrukt-ai-logs
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::missing GitHub Actions secret CARGO_REGISTRY_TOKEN"
            exit 1
          fi
          # crates.io's API requires an identifying User-Agent.
          UA="InstruktAI-logging-release (https://github.com/InstruktAI/logging)"
          # Dependency order: instrukt-ai-logs depends on instrukt-ai-logging.
          for crate in instrukt-ai-logging instrukt-ai-logs; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -A "${UA}" \
              "https://crates.io/api/v1/crates/${crate}/${VERSION}")"
            case "${code}" in
              200) echo "${crate} ${VERSION} is already on crates.io; skipping." ; continue ;;
              404) ;;
              *) echo "::error::crates.io answered HTTP ${code} for ${crate} ${VERSION}" ; exit 1 ;;
            esac
            # cargo waits until the published version is in the index, so the
            # next crate resolves it.
            cargo publish --locked -p "${crate}"
          done

  pypi:
    name: PyPI
    needs: tag
    if: inputs.registry == 'all' || inputs.registry == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build distributions
        run: python -m build

      - name: Publish to PyPI (API token)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
          # Attestations need trusted publishing (OIDC); this is token auth.
          attestations: false
          # A re-run after a partial upload must not fail on files already there.
          skip-existing: true
