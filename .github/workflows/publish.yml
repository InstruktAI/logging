name: Publish

# crates.io and PyPI for one release tag. One implementation, two entries:
#   - auto-release.yml calls it (workflow_call) after the GitHub Release is
#     published: crates first, then PyPI with the exact wheel and sdist that
#     build-verify.yml checked (the `python-dist` artifact of the same run;
#     a called workflow runs inside its caller's run, so the artifact is
#     reachable).
#   - by hand on a tag, for recovery: `gh workflow run publish.yml --ref vX.Y.Z`
#     (optionally `-f registry=crates|pypi`). PyPI then rebuilds the wheel and
#     sdist from the tag: those bytes are not the ones build-verify checked.
# Either way, `release` first requires the tag's GitHub Release to be public
# with exactly the planned asset set: nothing reaches a registry before the
# GitHub Release is complete. PyPI runs after crates.io. Each registry is its
# own job, so a failed one can be re-run alone, and each skips a version that
# is already published, so re-running is safe.
on:
  workflow_dispatch:
    inputs:
      registry:
        description: Which registry to publish to
        type: choice
        options: [all, crates, pypi]
        default: all
  workflow_call:
    inputs:
      tag:
        description: Release tag (vX.Y.Z) to publish.
        type: string
        required: true
      registry:
        description: all, crates or pypi
        type: string
        default: all
      python-dist-artifact:
        description: Artifact of this run holding the verified wheel and sdist; empty builds them from the tag.
        type: string
        default: ""
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false
      PYPI_TOKEN:
        required: false

permissions: {}

jobs:
  tag:
    name: Check the release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      # Called: the tag comes as an input (github.ref is the caller's ref).
      # Dispatched: the dispatched ref must be the tag.
      - name: Which tag?
        id: ref
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          elif [ "${REF_TYPE}" = "tag" ]; then
            TAG="${REF_NAME}"
          else
            echo "::error::dispatch this workflow on a release tag (vX.Y.Z), not ${REF_TYPE} ${REF_NAME}"
            exit 1
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${TAG} is not a release tag (vX.Y.Z)"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.ref.outputs.tag }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: The tag matches every version location
        id: tag
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          python .github/scripts/version.py check
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match the repository version ${VERSION}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # Fails closed unless vX is a published (non-draft) GitHub Release whose
  # asset names equal the set dist plans for the tag.
  release:
    name: GitHub Release is complete
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          persist-credentials: false

      - name: Install dist
        uses: ./.github/actions/install-dist

      - name: Public release with exactly the planned assets
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dist plan --tag="${TAG}" --output-format=json > "${RUNNER_TEMP}/plan.json"
          .github/scripts/dist-assets.sh "${RUNNER_TEMP}/plan.json" > "${RUNNER_TEMP}/planned.txt"
          .github/scripts/github-release.sh check-published "${TAG}" "${RUNNER_TEMP}/planned.txt"

  crates:
    name: crates.io
    needs: [tag, release]
    if: inputs.registry == 'all' || inputs.registry == 'crates'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-12
        with:
          toolchain: "1.99.1"

      - name: Publish instrukt-ai-logging, then instrukt-ai-logs
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: .github/scripts/publish-crates.sh "${VERSION}"

  # After crates.io: with registry=all, only when crates succeeded (a crate
  # already published counts: the script skips it and the job succeeds).
  # With registry=pypi the crates job is skipped by choice and PyPI runs.
  pypi:
    name: PyPI
    needs: [tag, release, crates]
    if: >-
      always() && needs.tag.result == 'success' && needs.release.result == 'success'
      && (inputs.registry == 'all' || inputs.registry == 'pypi')
      && (needs.crates.result == 'success'
      || (needs.crates.result == 'skipped' && inputs.registry == 'pypi'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          persist-credentials: false

      # PyPI is the last registry: with `registry=pypi` the crates job is
      # skipped by choice, so check here that both crates are already on
      # crates.io at this version (yanked counts as published) before
      # anything reaches PyPI. Any other answer stops the job.
      - name: Both crates are on crates.io first
        if: needs.crates.result == 'skipped'
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          # crates.io's API requires an identifying User-Agent.
          UA="InstruktAI-logging-release (https://github.com/InstruktAI/logging)"
          for crate in instrukt-ai-logging instrukt-ai-logs; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -A "${UA}" \
              "https://crates.io/api/v1/crates/${crate}/${VERSION}")"
            if [ "${code}" != "200" ]; then
              echo "::error::${crate} ${VERSION} is not on crates.io (HTTP ${code}); publish the crates first (registry=crates), then PyPI."
              exit 1
            fi
            echo "${crate} ${VERSION} is on crates.io."
          done

      - name: Fetch the verified distributions
        if: inputs.python-dist-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.python-dist-artifact }}
          path: dist/

      - name: Set up uv
        if: inputs.python-dist-artifact == ''
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.11"

      - name: Rebuild distributions from the tag (manual recovery only)
        if: inputs.python-dist-artifact == ''
        # uv writes a .gitignore into the output directory; it is not a
        # distribution.
        run: |
          uv build --out-dir dist/
          rm -f dist/.gitignore

      - name: Exactly the wheel and sdist of this version
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: .github/scripts/check-python-dist.sh dist "${VERSION}"

      - name: Publish to PyPI (API token)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist/
          # Attestations need trusted publishing (OIDC); this is token auth.
          attestations: false
          # A re-run after a partial upload must not fail on files already there.
          skip-existing: true
