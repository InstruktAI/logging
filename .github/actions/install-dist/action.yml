name: Install dist
description: >-
  Download the pinned dist (axodotdev, formerly cargo-dist) release binary for
  this runner, verify it against a checksum recorded here, and put it on PATH.
  The version must match `cargo-dist-version` in dist-workspace.toml.
runs:
  using: composite
  steps:
    - name: Download and verify dist
      shell: bash
      env:
        DIST_VERSION: "0.33.1"
      run: |
        set -euo pipefail
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)   triple=x86_64-unknown-linux-gnu;  sum=da68e159d5fed1ee61b00284da444e719927dbd0b7d0e2c34e57a04414453cf9 ;;
          Linux-ARM64) triple=aarch64-unknown-linux-gnu; sum=e883f4c6c17f2458d6ced950d978c04b45423ed3a5fdbebcb8f8de568389e1c1 ;;
          macOS-X64)   triple=x86_64-apple-darwin;       sum=e9dc303035fbb2f44295948e0a076f1d1d218a0328e9b84e16955863bba92bf4 ;;
          macOS-ARM64) triple=aarch64-apple-darwin;      sum=b8bf041a38e9e54ecf41eee2574ca6644043796620bb0ee8340e9c0acbaaae8f ;;
          *) echo "::error::no pinned dist binary for ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
        esac
        dir="${RUNNER_TEMP}/dist-${DIST_VERSION}"
        mkdir -p "${dir}"
        curl --proto '=https' --tlsv1.2 -fsSL -o "${dir}/dist.tar.xz" \
          "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-${triple}.tar.xz"
        echo "${sum}  ${dir}/dist.tar.xz" | shasum -a 256 -c -
        tar -xJf "${dir}/dist.tar.xz" -C "${dir}" --strip-components=1
        "${dir}/dist" --version
        echo "${dir}" >> "${GITHUB_PATH}"
