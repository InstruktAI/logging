[workspace]
resolver = "3"
members = ["crates/instrukt-ai-logging", "crates/instrukt-ai-logs"]

[workspace.package]
# One version for the whole repository: the release job bumps this together
# with pyproject.toml and the instrukt-ai-logging dependency pin below.
version = "0.10.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/InstruktAI/logging"
homepage = "https://github.com/InstruktAI/logging"

[workspace.dependencies]
instrukt-ai-logging = { path = "crates/instrukt-ai-logging", version = "0.10.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# The profile dist builds release binaries with.
[profile.dist]
inherits = "release"
lto = "thin"
