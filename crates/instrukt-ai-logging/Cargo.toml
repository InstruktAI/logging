[package]
name = "instrukt-ai-logging"
description = "InstruktAI logging contract for Rust: a tracing layer writing single-line logfmt to the shared XDG log location."
readme = "README.md"
keywords = ["logging", "tracing", "logfmt"]
categories = ["development-tools::debugging"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl"] }
time = { version = "0.3.47", default-features = false, features = ["std"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-log = { version = "0.2.0", default-features = false, features = ["std", "log-tracer"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry"] }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
